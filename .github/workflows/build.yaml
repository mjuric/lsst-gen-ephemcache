name: build

# Builds the ephemerides cache generator image and pushes it to ghcr.
#
# Kubernetes needs an OCI image from a registry, which is what this produces.
# Local podman builds on USDF are for iteration only — that account has no
# subuid range, so images built there need ignore_chown_errors and have wrong
# file ownership. This workflow is the source of the deployable artifact.

on:
  push:
    branches:
      - u/mjuric/ephemcache
    tags:
      - "v*"
  pull_request:
    branches:
      - u/mjuric/ephemcache
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag to publish (e.g. selftest)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # sufficient for pushes to the user's own namespace

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Do not log in on pull_request: no push, and no secrets for forks.
      - name: Log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mjuric/lsst-gen-ephemcache
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,format=long
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # Load into the local daemon so selftest can run before we push.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: ephemcache:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate the push on the image actually working. This catches the class of
      # bug that is invisible at build time: a missing tzdata silently yields
      # UTC and would compute the wrong observing night, and a missing
      # transitive dependency only shows up on import.
      - name: Selftest
        run: docker run --rm ephemcache:ci selftest

      - name: Record resolved versions
        run: |
          docker run --rm --entrypoint cat ephemcache:ci \
            /app/build-manifest.conda.txt > build-manifest.conda.txt || true
          docker run --rm --entrypoint cat ephemcache:ci \
            /app/build-manifest.pip.txt > build-manifest.pip.txt || true
          docker run --rm --entrypoint cat ephemcache:ci \
            /app/build-manifest.mpsky-sha.txt > build-manifest.mpsky-sha.txt || true

      # Nothing in the image is version-pinned yet, so these manifests are the
      # only record of what a given tag actually contains.
      - name: Upload manifests
        uses: actions/upload-artifact@v4
        with:
          name: build-manifests-${{ github.sha }}
          path: build-manifest.*.txt
          if-no-files-found: warn

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
